name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify GitHub Actions pin contract
        shell: powershell
        run: .\scripts\github-actions-pin-contract.ps1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: Install native build prerequisite
        shell: powershell
        run: choco install strawberryperl --no-progress -y
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm contract:rust-boundaries
      - run: pnpm bindings:check
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --all-targets --manifest-path src-tauri/Cargo.toml

  windows-package:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
      - name: Install native build prerequisite
        shell: powershell
        run: choco install strawberryperl --no-progress -y
      - run: pnpm install --frozen-lockfile
      - name: Verify Windows release contract
        shell: powershell
        run: .\scripts\windows-release-contract.ps1
      - name: Test signed-release source contract
        shell: powershell
        run: .\scripts\windows-release-source-contract.tests.ps1
      - run: pnpm tauri build
      - name: Smoke test installed GUI and single instance
        shell: powershell
        run: .\scripts\windows-installer-smoke.ps1

  windows-arm64-package:
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
          targets: aarch64-pc-windows-msvc
      - name: Install native build prerequisite
        shell: powershell
        run: choco install strawberryperl --no-progress -y
      - run: pnpm install --frozen-lockfile
      - name: Verify Windows release contract
        shell: powershell
        run: .\scripts\windows-release-contract.ps1
      - name: Build native ARM64 installer
        run: pnpm tauri build --target aarch64-pc-windows-msvc
      - name: Rust ARM64 compatibility tests
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --test windows_compatibility --test startup_safety
      - name: Smoke test native ARM64 GUI and single instance
        shell: powershell
        run: .\scripts\windows-installer-smoke.ps1 -InstallerDirectory src-tauri\target\aarch64-pc-windows-msvc\release\bundle\nsis -ExpectedArchitecture arm64

  supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1
      - run: supabase start
      - run: supabase test db
