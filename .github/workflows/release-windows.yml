name: Signed Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify-release-source:
    runs-on: windows-2025
    outputs:
      source_commit: ${{ steps.verify.outputs.source_commit }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify annotated tag, main identity, and successful CI
        id: verify
        shell: powershell
        run: |
          $tagReference = "refs/tags/$env:RELEASE_TAG"
          $tagObjectType = (& git cat-file -t $tagReference).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to read release tag '$env:RELEASE_TAG'." }
          $sourceCommit = (& git rev-parse "$tagReference^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to resolve release tag '$env:RELEASE_TAG'." }
          $mainCommit = (& git rev-parse origin/main).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve origin/main.' }
          $ciRunsJson = & gh run list `
            --repo $env:GITHUB_REPOSITORY `
            --workflow CI `
            --commit $sourceCommit `
            --event push `
            --status completed `
            --limit 20 `
            --json conclusion,event,headSha,databaseId,url
          if ($LASTEXITCODE -ne 0) { throw 'Unable to query CI run evidence.' }
          .\scripts\windows-release-source-contract.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -TagObjectType $tagObjectType `
            -SourceCommit $sourceCommit `
            -MainCommit $mainCommit `
            -CiRunsJson $ciRunsJson
          "source_commit=$sourceCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  signed-windows:
    needs: verify-release-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: production
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
      WINDOWS_UPDATER_PUBLIC_KEY: ${{ vars.WINDOWS_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verify-release-source.outputs.source_commit }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.architecture == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}
      - name: Install native build prerequisite
        shell: powershell
        run: choco install strawberryperl --no-progress -y
      - run: pnpm install --frozen-lockfile
      - name: Build and verify signed installer
        shell: powershell
        run: .\scripts\windows-signed-release.ps1 -ReleaseTag $env:RELEASE_TAG -Architecture ${{ matrix.architecture }}
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mistake-trainer-next-${{ env.RELEASE_TAG }}-windows-${{ matrix.architecture }}
          if-no-files-found: error
          path: |
            src-tauri/target/*-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/*-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/*-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sha256

  draft-release:
    needs: [verify-release-source, signed-windows]
    runs-on: windows-2025
    environment: production
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verify-release-source.outputs.source_commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mistake-trainer-next-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}-windows-*
          path: verified-installers
          merge-multiple: true
      - name: Generate dual-architecture update manifest
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $artifacts = @(Get-ChildItem verified-installers -File)
          if ($artifacts.Count -ne 6) { throw "Expected two installers, two updater signatures, and two checksums; found $($artifacts.Count)." }
          .\scripts\windows-update-manifest.ps1 `
            -ArtifactDirectory verified-installers `
            -ReleaseTag $env:RELEASE_TAG `
            -RepositorySlug $env:GITHUB_REPOSITORY `
            -OutputPath verified-installers\latest.json
      - name: Create draft GitHub release with both architectures
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $artifacts = @(Get-ChildItem verified-installers -File)
          if ($artifacts.Count -ne 7) { throw "Expected two installers, two updater signatures, two checksums, and latest.json; found $($artifacts.Count)." }
          $artifactPaths = @($artifacts | ForEach-Object { $_.FullName })
          & gh release create $env:RELEASE_TAG --draft --verify-tag --generate-notes $artifactPaths
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation exited with code $LASTEXITCODE." }
