<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>手机采集 · Mistake Trainer</title>
    <style>
      :root { color:#22302b; background:#f6f1e7; font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif; font-synthesis:none; }
      * { box-sizing:border-box; } body { min-height:100vh; margin:0; background:radial-gradient(circle at 90% 0%,rgba(185,88,63,.11),transparent 30rem),#f6f1e7; }
      button,input { font:inherit; } button { -webkit-tap-highlight-color:transparent; }
      .shell { width:min(760px,100%); max-width:100%; margin:0 auto; padding:22px 18px 120px; overflow-x:hidden; }
      .eyebrow { margin:0 0 8px; color:#9c513c; font-size:13px; font-weight:700; letter-spacing:.08em; }
      h1 { margin:0; font-family:Georgia,"STSong",serif; font-size:clamp(34px,9vw,52px); line-height:1.05; }
      .lede { margin:12px 0 20px; color:#64716c; line-height:1.7; }
      .notice,.panel { border:1px solid rgba(33,51,45,.12); border-radius:20px; background:rgba(255,253,247,.82); box-shadow:0 18px 44px rgba(62,49,30,.08); }
      .notice { padding:12px 15px; color:#6d6256; font-size:13px; line-height:1.55; }
      .panel { margin-top:16px; padding:18px; } label { display:block; margin-bottom:8px; font-size:13px; font-weight:700; }
      .subject { width:100%; min-height:48px; padding:0 14px; border:1px solid #d9cfbd; border-radius:13px; outline:none; color:#22302b; background:#fffdf8; }
      .subject:focus { border-color:#42675b; box-shadow:0 0 0 3px rgba(66,103,91,.12); }
      .stats { display:flex; gap:10px; margin-top:14px; } .stat { flex:1; padding:12px; border-radius:14px; background:#ece4d5; }
      .stat span { display:block; color:#6c756f; font-size:12px; } .stat strong { display:block; margin-top:4px; font-family:Georgia,serif; font-size:20px; }
      .actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }

      .pick.secondary { background:#e8ddc7; color:#22302b; } .pick input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; } .pick b { font-size:17px; } .pick small { opacity:.72; }
      .pick.is-active { border-color:#b9583f; background:#36564a; box-shadow:0 0 0 3px rgba(185,88,63,.16),0 14px 28px rgba(33,51,45,.16); }
      .camera-input { position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none; }
      .camera-mode { position:fixed; z-index:11; left:50%; bottom:82px; width:min(724px,calc(100% - 28px)); display:flex; gap:12px; align-items:center; justify-content:space-between; padding:12px 14px; color:#36564a; border:1px solid rgba(66,103,91,.24); border-radius:16px; background:rgba(241,246,241,.96); box-shadow:0 16px 42px rgba(33,51,45,.2); backdrop-filter:blur(16px); transform:translateX(-50%); font-size:12px; line-height:1.45; }
      .camera-mode-copy { min-width:0; } .camera-mode-copy strong,.camera-mode-copy span { display:block; } .camera-mode-copy strong { margin-bottom:2px; color:#21332d; font-size:13px; }
      .camera-mode-actions { display:flex; flex:0 0 auto; gap:8px; }
      .camera-mode button { min-height:38px; padding:0 13px; border-radius:999px; font-size:11px; font-weight:800; }
      .next-camera { flex:1 1 auto; color:#fffdf8; border:1px solid #36564a; background:#36564a; box-shadow:0 8px 18px rgba(33,51,45,.16); }
      .stop-camera { color:#744b3e; border:1px solid rgba(185,88,63,.28); background:#fff8ef; }
      .queue-head { display:flex; align-items:end; justify-content:space-between; gap:12px; margin:28px 2px 12px; } .queue-head h2 { margin:0; font-size:21px; } .queue-head span { color:#737d77; font-size:13px; }
      .queue-tools { display:flex; min-width:0; gap:9px; align-items:center; justify-content:flex-end; } .review-capture { min-height:38px; padding:0 13px; border:1px solid rgba(33,51,45,.18); border-radius:999px; color:#21332d; background:#e8ddc7; font-size:12px; font-weight:800; white-space:nowrap; } .review-capture:disabled { opacity:.42; }
      .queue { display:grid; gap:10px; } .empty { padding:30px 18px; border:1px dashed #cfc3ae; border-radius:18px; color:#78817c; text-align:center; }
      .item { display:grid; width:100%; max-width:100%; min-width:0; overflow:hidden; grid-template-columns:76px minmax(0,1fr) auto; grid-template-rows:auto auto; gap:8px 10px; align-items:center; padding:10px; border:1px solid rgba(33,51,45,.11); border-radius:16px; background:rgba(255,253,248,.8); animation:item-enter 180ms cubic-bezier(.2,.8,.2,1); transition:border-color 180ms ease,background 180ms ease,transform 180ms ease; }
      .item img { grid-row:1/3; width:76px; height:76px; object-fit:cover; border-radius:11px; background:#e8ddc7; transition:opacity 180ms cubic-bezier(.2,.8,.2,1),transform 180ms cubic-bezier(.2,.8,.2,1); } .item>div { min-width:0; } .item-copy { grid-row:1/3; } .item strong,.item small { display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .item strong { font-size:14px; } .item small { margin-top:6px; color:#727b76; } .item[data-status="failed"] small { color:#b04331; white-space:normal; overflow-wrap:anywhere; }
      .item[data-status="uploading"],.item[data-status="preparing"],.item[data-status="pending"] { border-color:rgba(66,103,91,.3); background:rgba(225,235,229,.5); }
      .item[data-status="done"] { border-color:rgba(66,103,91,.38); background:rgba(225,235,229,.72); }
      .item[data-status="failed"] { border-color:rgba(176,67,49,.38); background:rgba(247,225,216,.72); }
      .item-actions { grid-column:3; grid-row:1/3; display:grid; gap:6px; justify-items:end; } .item-action { min-height:34px; padding:0 10px; border:0; border-radius:999px; font-size:11px; font-weight:800; white-space:nowrap; } .edit-crop { display:none; color:#fffdf8; background:#36564a; } .item[data-status="done"] .edit-crop { display:block; } .item[data-cropped="true"] .edit-crop { color:#8b402e; background:#f0ddd2; }
      .retry { display:none; color:#21332d; background:#dce7e1; } .item[data-status="failed"] .retry { display:block; }
      .remove { width:34px; padding:0; color:#744b3e; background:#eee5d6; } .item[data-cropped="true"] .remove { display:none; }
      .footer { position:fixed; z-index:10; left:0; right:0; bottom:0; padding:12px max(18px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)); border-top:1px solid rgba(33,51,45,.12); background:rgba(246,241,231,.92); backdrop-filter:blur(16px); }
      .finish { width:min(724px,100%); min-height:52px; margin:auto; display:block; border:0; border-radius:15px; color:#fffdf8; background:#b9583f; font-weight:800; } .finish:disabled { opacity:.48; }
      .error { margin-top:14px; padding:12px 14px; border-radius:12px; color:#8c3525; background:#f6ded6; line-height:1.5; } .hidden { display:none!important; }
      body.camera-loop .shell { padding-bottom:210px; }
      body.crop-open { overflow:hidden; }
      .crop-modal { position:fixed; z-index:30; inset:0; display:grid; padding:12px; background:rgba(19,29,25,.7); backdrop-filter:blur(10px); animation:modal-fade 240ms cubic-bezier(.2,.8,.2,1); }
      .crop-dialog { width:min(760px,100%); min-width:0; height:min(900px,calc(100dvh - 24px)); min-height:0; margin:auto; display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; overflow:hidden; border:1px solid rgba(255,255,255,.26); border-radius:24px; background:#f6f1e7; box-shadow:0 30px 90px rgba(11,20,16,.38); animation:modal-rise 240ms cubic-bezier(.2,.8,.2,1); }
      .crop-dialog>* { min-width:0; }
      .crop-head { min-width:0; display:flex; gap:12px; align-items:center; justify-content:space-between; padding:15px 17px 12px; border-bottom:1px solid rgba(33,51,45,.1); } .crop-head-copy { flex:1 1 auto; min-width:0; } .crop-kicker { display:block; margin-bottom:3px; color:#b9583f; font-size:10px; font-weight:850; letter-spacing:.1em; } .crop-title { margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:Georgia,"STSong",serif; font-size:20px; } .crop-close { flex:0 0 auto; width:40px; height:40px; border:1px solid rgba(33,51,45,.12); border-radius:50%; color:#21332d; background:#fffdf8; font-size:22px; }
      .crop-tools { display:flex; gap:8px; align-items:center; padding:9px 14px; overflow-x:auto; border-bottom:1px solid rgba(33,51,45,.1); background:rgba(232,221,199,.34); } .crop-tools button { flex:0 0 auto; min-height:38px; padding:0 12px; border:1px solid rgba(33,51,45,.14); border-radius:999px; color:#21332d; background:#fffdf8; font-size:12px; font-weight:750; } .crop-tools button:disabled { opacity:.42; }
      .crop-stage { min-width:0; min-height:0; overflow:hidden; display:grid; place-items:center; padding:22px; background:#18231f; background-image:radial-gradient(rgba(246,241,231,.08) 1px,transparent 1px); background-size:18px 18px; }
      .crop-image-shell { position:relative; display:inline-grid; max-width:100%; max-height:100%; line-height:0; box-shadow:0 12px 42px rgba(0,0,0,.34); touch-action:none; } .crop-canvas { display:block; width:auto; height:auto; max-width:min(680px,calc(100vw - 54px)); max-height:calc(100dvh - 285px); background:#fff; } .crop-overlay { position:absolute; inset:0; touch-action:none; }
      .crop-box { position:absolute; box-sizing:border-box; border:2px solid #f2cc72; border-radius:5px; background:rgba(242,204,114,.08); box-shadow:0 0 0 9999px rgba(8,15,12,.48),0 0 0 1px rgba(33,51,45,.76); cursor:move; transition:border-color 180ms cubic-bezier(.2,.8,.2,1),background 180ms cubic-bezier(.2,.8,.2,1); touch-action:none; } .crop-box:focus-visible { outline:3px solid rgba(255,255,255,.9); outline-offset:3px; } .crop-handle { position:absolute; width:22px; height:22px; padding:0; border:2px solid #fff; border-radius:7px; background:#b9583f; box-shadow:0 3px 10px rgba(0,0,0,.28); } .crop-handle[data-handle="nw"]{left:-12px;top:-12px;cursor:nwse-resize}.crop-handle[data-handle="ne"]{right:-12px;top:-12px;cursor:nesw-resize}.crop-handle[data-handle="sw"]{left:-12px;bottom:-12px;cursor:nesw-resize}.crop-handle[data-handle="se"]{right:-12px;bottom:-12px;cursor:nwse-resize}
      .crop-dialog[data-derived="true"] .crop-box { display:none; } .crop-dialog[data-derived="true"] .crop-tools .crop-edit-tool { display:none; } .crop-derived-note { display:none; margin:0; padding:10px 16px; color:#754737; background:#f0ddd2; font-size:12px; line-height:1.5; } .crop-dialog[data-derived="true"] .crop-derived-note { display:block; }
      .crop-foot { min-width:0; display:grid; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid rgba(33,51,45,.1); background:#fffaf1; } .crop-progress { min-width:0; display:flex; justify-content:space-between; gap:8px; color:#6a756e; font-size:11px; } .crop-progress span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .crop-foot-actions { width:100%; min-width:0; display:grid; grid-template-columns:auto minmax(0,1fr) minmax(0,1.25fr); gap:8px; } .crop-foot button { min-width:0; min-height:46px; padding:0 12px; overflow:hidden; border:1px solid rgba(33,51,45,.14); border-radius:13px; color:#21332d; background:#eee5d6; font-size:12px; font-weight:800; text-overflow:ellipsis; white-space:nowrap; } .crop-foot .crop-apply { color:#fffdf8; border-color:#b9583f; background:#b9583f; } .crop-foot button:disabled { opacity:.43; }
      @media(max-width:520px){.shell{padding-inline:14px}.panel{padding:14px}.actions{gap:9px}.pick{min-height:108px}.camera-mode{align-items:stretch;flex-direction:column;bottom:80px}.camera-mode-actions{display:grid;grid-template-columns:1fr auto}.camera-mode button{min-height:44px}.next-camera{font-size:13px}.queue-head{align-items:flex-start;flex-direction:column}.queue-tools{width:100%;justify-content:space-between}.item{grid-template-columns:68px minmax(0,1fr) auto}.item img{width:68px;height:74px}.item-action{min-height:32px;padding-inline:9px}.crop-modal{padding:0}.crop-dialog{height:100dvh;border-radius:0}.crop-head{padding-top:max(13px,env(safe-area-inset-top))}.crop-stage{padding:16px}.crop-canvas{max-width:calc(100vw - 32px);max-height:calc(100dvh - 282px)}.crop-foot-actions{grid-template-columns:auto minmax(0,1fr) minmax(0,1.1fr)}.crop-foot button{padding-inline:8px;font-size:11px}}
      @keyframes item-enter{from{opacity:0;transform:translateY(7px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes modal-fade{from{opacity:0}to{opacity:1}} @keyframes modal-rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes camera-ready{0%{opacity:.72;transform:scale(.96)}55%{opacity:1;transform:scale(1.025)}100%{opacity:1;transform:scale(1)}}
      @media(prefers-reduced-motion:no-preference){button{transition:transform 120ms ease,opacity 120ms ease}button:active,.pick:active{transform:scale(.98)}.camera-mode.is-ready .next-camera{animation:camera-ready 300ms cubic-bezier(.2,.8,.2,1)}}
      @media(prefers-reduced-motion:reduce){.item,.item img,.crop-box{animation:none;transition:none}.crop-modal,.crop-dialog{animation:none}button:active,.pick:active{transform:none}.pick.is-active{box-shadow:none}}
    </style>
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">MISTAKE TRAINER · 局域网采集</p><h1>把错题先收进来</h1>
      <p class="lede">快速逐张拍，或从相册一次选择多张。图片会直接发送到你的电脑，不经过云端。</p>
      <div class="notice">仅限可信的家庭 Wi‑Fi 或个人热点。公共 Wi‑Fi 不安全，也不受支持。</div>
      <div id="error" class="error hidden" role="alert"></div>
      <section class="panel" aria-label="采集设置">
        <label for="subject">这一批的科目</label><input id="subject" class="subject" maxlength="40" placeholder="例如：数学（可以稍后补）" />
        <div class="stats"><div class="stat"><span>本次已收到</span><strong id="receivedCount">0 张</strong></div><div class="stat"><span>会话剩余</span><strong id="remaining">--</strong></div></div>
        <div class="actions">
          <button id="cameraPick" class="pick" type="button" aria-pressed="false" disabled><b id="cameraPickTitle">快速拍一张</b><small>上一张会在后台上传，不用等待</small></button>
          <label class="pick secondary"><b>相册多选</b><small>一次选择多张</small><input id="albumInput" type="file" accept="image/*,.heic,.heif" multiple /></label>
        </div>
        <input id="cameraInput" class="camera-input" type="file" accept="image/*,.heic,.heif" capture="environment" multiple />
      </section>
      <div class="queue-head"><h2>上传队列</h2><div class="queue-tools"><span id="queueSummary">等待选择图片</span><button id="reviewCapture" class="review-capture" type="button" disabled>拍完统一检查</button></div></div>
      <section id="queue" class="queue" aria-live="polite"><div id="empty" class="empty">拍完就会自动压缩、去除定位信息并上传。</div></section>
    </main>
    <div id="cameraMode" class="camera-mode hidden" aria-live="polite">
      <div class="camera-mode-copy"><strong id="cameraModeTitle">快速拍摄已就绪</strong><span id="cameraModeCopy">确认照片后会回到这里；上一张会在后台处理。</span></div>
      <div class="camera-mode-actions"><button id="nextCamera" class="next-camera" type="button">继续拍一张</button><button id="stopCamera" class="stop-camera" type="button">收起快拍</button></div>
    </div>
    <div id="cropModal" class="crop-modal hidden">
      <section id="cropDialog" class="crop-dialog" role="dialog" aria-modal="true" aria-labelledby="cropTitle" tabindex="-1" data-derived="false">
        <header class="crop-head"><div class="crop-head-copy"><span id="cropKicker" class="crop-kicker">快速裁剪</span><h2 id="cropTitle" class="crop-title">检查图片</h2></div><button id="cropClose" class="crop-close" type="button" aria-label="关闭裁剪">×</button></header>
        <div><nav class="crop-tools" aria-label="裁剪工具"><button id="rotateLeft" class="crop-edit-tool" type="button">↶ 左转 90°</button><button id="rotateRight" class="crop-edit-tool" type="button">↷ 右转 90°</button><button id="cropReset" class="crop-edit-tool" type="button">重置范围</button></nav><p class="crop-derived-note">这张图片已经由原图裁剪生成。原图仍保存在电脑中，可以一键恢复后重新调整。</p></div>
        <div class="crop-stage"><div id="cropImageShell" class="crop-image-shell"><canvas id="cropCanvas" class="crop-canvas"></canvas><div id="cropOverlay" class="crop-overlay"><div id="cropBox" class="crop-box" tabindex="0" aria-label="裁剪范围，可拖动；方向键移动，按住 Shift 调整大小"><button class="crop-handle" type="button" data-handle="nw" aria-label="调整左上角"></button><button class="crop-handle" type="button" data-handle="ne" aria-label="调整右上角"></button><button class="crop-handle" type="button" data-handle="sw" aria-label="调整左下角"></button><button class="crop-handle" type="button" data-handle="se" aria-label="调整右下角"></button></div></div></div></div>
        <footer class="crop-foot"><div class="crop-progress"><span id="cropProgress">单张检查</span><span>原图不会被覆盖</span></div><div class="crop-foot-actions"><button id="cropPrevious" type="button" aria-label="上一张">←</button><button id="cropSkip" type="button">保留原图，下一张</button><button id="cropApply" class="crop-apply" type="button">应用裁剪</button></div></footer>
      </section>
    </div>
    <footer class="footer"><button id="finish" class="finish">结束拍摄，回电脑整理</button></footer>
    <script>
      (()=>{
        const fragmentToken=location.hash.slice(1); if(fragmentToken)sessionStorage.setItem('captureLanToken',fragmentToken);
        const token=fragmentToken||sessionStorage.getItem('captureLanToken')||''; if(fragmentToken)history.replaceState(null,'','/mobile/');
        const state={items:[],active:0,previewActive:0,nextSourceSequence:0,session:null,subjectTimer:0,cameraLoop:false,cameraFallbackTimer:0,cameraReadyTimer:0,acceptedCameraCount:0,editor:null,editorBusy:false,editorPointer:null};
        const queue=document.querySelector('#queue'),empty=document.querySelector('#empty'),errorBox=document.querySelector('#error'),subject=document.querySelector('#subject'),finish=document.querySelector('#finish'),count=document.querySelector('#receivedCount'),remaining=document.querySelector('#remaining'),queueSummary=document.querySelector('#queueSummary'),cameraInput=document.querySelector('#cameraInput'),cameraPick=document.querySelector('#cameraPick'),cameraPickTitle=document.querySelector('#cameraPickTitle'),cameraMode=document.querySelector('#cameraMode'),cameraModeTitle=document.querySelector('#cameraModeTitle'),cameraModeCopy=document.querySelector('#cameraModeCopy'),nextCamera=document.querySelector('#nextCamera'),stopCamera=document.querySelector('#stopCamera'),reviewCapture=document.querySelector('#reviewCapture'),cropModal=document.querySelector('#cropModal'),cropDialog=document.querySelector('#cropDialog'),cropTitle=document.querySelector('#cropTitle'),cropKicker=document.querySelector('#cropKicker'),cropClose=document.querySelector('#cropClose'),cropCanvas=document.querySelector('#cropCanvas'),cropOverlay=document.querySelector('#cropOverlay'),cropBox=document.querySelector('#cropBox'),cropProgress=document.querySelector('#cropProgress'),rotateLeft=document.querySelector('#rotateLeft'),rotateRight=document.querySelector('#rotateRight'),cropReset=document.querySelector('#cropReset'),cropPrevious=document.querySelector('#cropPrevious'),cropSkip=document.querySelector('#cropSkip'),cropApply=document.querySelector('#cropApply');
        const isWeChat=/MicroMessenger/i.test(navigator.userAgent||''),reducedMotion=window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches??false;
        const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms)),nextFrame=()=>new Promise(resolve=>requestAnimationFrame(resolve));
        const showError=message=>{errorBox.textContent=message;errorBox.classList.toggle('hidden',!message)};
        const createClientId=()=>{if(window.crypto&&typeof window.crypto.randomUUID==='function')return window.crypto.randomUUID();const bytes=new Uint8Array(16);if(window.crypto&&typeof window.crypto.getRandomValues==='function')window.crypto.getRandomValues(bytes);else for(let index=0;index<bytes.length;index+=1)bytes[index]=Math.floor(Math.random()*256);bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const hex=Array.from(bytes).map(value=>value.toString(16).padStart(2,'0')).join('');return`${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`};
        const api=async(path,options={})=>{const headers=new Headers(options.headers||{});headers.set('Authorization',`Bearer ${token}`);const response=await fetch(`/api/v1${path}`,{...options,headers});if(!response.ok){const detail=await response.json().catch(()=>({}));throw new Error(detail.message||`请求失败（${response.status}）`)}if(response.status===204)return null;return response.json()};
