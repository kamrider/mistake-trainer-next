[package]
name = "mistake-trainer-next"
version = "0.1.0"
description = "Offline-first mistake training desktop app"
authors = ["Mistake Trainer Next contributors"]
edition = "2024"
rust-version = "1.97"
build = "build.rs"

[lib]
name = "mistake_trainer_next_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
aes-gcm = "0.10"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
docx-rs = "=0.4.20"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = { version = "=4.1.4", default-features = false, features = ["v1", "windows-native-keyring-store"] }
fsrs = "=6.6.1"
futures-util = { version = "=0.3.32", default-features = false, features = ["std"] }
if-addrs = "=0.15.0"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
rusqlite = { version = "0.38", features = ["backup", "bundled-sqlcipher-vendored-openssl", "uuid"] }
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "=0.0.12"
sha2 = "0.10"
tauri = { version = "2.11", features = [] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
thiserror = "2"
tokio = { version = "=1.52.3", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v7", "serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
tower = { version = "=0.5.3", features = ["util"] }
zip = "=0.6.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
